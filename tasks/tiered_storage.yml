---

# Ensure plugins are installed
- name: download s3 plugin from repository
  get_url:
    url: "https://github.com/Aiven-Open/tiered-storage-for-apache-kafka/releases/download/v1.0.0/s3-1.0.0.tgz"
    dest: "{{ item }}"
    owner: kafka
    group: kafka
    mode: '0755'
  loop:
    - /tmp/tiered-storage-for-apache-kafka_s3.tgz
    - /tmp/tiered-storage-for-apache-kafka_core.tgz

- name: unarchive s3 plugins
  unarchive:
    src: "{{ item }}"
    dest: "{{ kafka_home }}/libs"
    remote_src: yes
  loop:
    - /tmp/tiered-storage-for-apache-kafka_s3.tgz
    - /tmp/tiered-storage-for-apache-kafka_core.tgz

- name: clean up temporary files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/tiered-storage-for-apache-kafka_s3.tgz
    - /tmp/tiered-storage-for-apache-kafka_core.tgz

# Cache
- name: ensure cache folder is initialised
  file:
    path: "/etc/mysqld_exporter"
    state: directory
    owner: kafka
    group: kafka
    mode: "0750"